<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>غير متصل بالإنترنت — الأسطول الآلي</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <link rel="icon" href="/icons/icon-192.png" />
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0F172A 0%, #1e293b 100%);
        color: #f8fafc;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        text-align: center;
      }
      .card { max-width: 28rem; width: 100%; }
      img { width: 84px; height: 84px; border-radius: 16px; background: #fff; padding: 8px; margin-bottom: 1.5rem; }
      h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
      p { color: #cbd5e1; margin: 0 0 2rem; line-height: 1.7; }
      button {
        background: #3b82f6; color: #fff; border: 0; padding: 0.75rem 1.75rem;
        border-radius: 0.5rem; font: inherit; font-weight: 600; cursor: pointer;
        transition: background 0.15s;
      }
      button:hover { background: #2563eb; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/icons/icon-192.png" alt="الأسطول الآلي" />
      <h1>أنت غير متصل بالإنترنت</h1>
      <p>أنت غير متصل بالإنترنت حالياً. بعض الميزات قد لا تكون متاحة حتى استعادة الاتصال.</p>
      <button onclick="location.reload()">إعادة المحاولة</button>
    </div>
  </body>
</html>
