name: Gate 11 validation

on:
  push:
    branches:
      - gate11-cost-accounting-engine

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate11
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts

      - name: Gate 11 static checks
        run: npm run check:gate11-cost-accounting

      - name: PostgreSQL 16 migration and behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gate11 -f scripts/tmp-gate11-fixture.sql
          psql -h 127.0.0.1 -U postgres -d gate11 -f supabase/migrations/20260906100000_gate11_cost_accounting_engine.sql
          psql -h 127.0.0.1 -U postgres -d gate11 -f scripts/tmp-gate11-behavior.sql

      - name: Cost-period concurrency serialization
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gate11 -v ON_ERROR_STOP=1 <<'SQL' &
          BEGIN;
          SELECT public.cost_gate11_period_lock('2027-01');
          SELECT pg_sleep(4);
          COMMIT;
          SQL
          locker_pid=$!
          sleep 1
          started=$(date +%s)
          psql -h 127.0.0.1 -U postgres -d gate11 -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('app.test_admin','true',false);
          SELECT set_config('request.jwt.claim.sub','00000000-0000-0000-0000-000000000001',false);
          SELECT set_config('request.jwt.claim.role','authenticated',false);
          SELECT (public.cost_entry_create_manual('concurrency',10,'2027-01-01','lock serialization')).id;
          SQL
          finished=$(date +%s)
          wait "$locker_pid"
          elapsed=$((finished-started))
          echo "blocked seconds: $elapsed"
          if [ "$elapsed" -lt 2 ]; then
            echo "Cost posting did not serialize behind the shared period lock"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Full verification
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check 46ec990e65e6bf485342060c8a043919ac871a3f..HEAD
