name: Gate 8 PR validation

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - scripts/check-gate8-payroll-cost-ledger.mjs
      - supabase/migrations/20260903090000_gate8_payroll_cost_ledger.sql

jobs:
  validate:
    if: github.head_ref == 'gate8-payroll-cost-ledger'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate8
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gate8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run code verification
        run: |
          npm run check:gate8-payroll-cost
          npm run check:gate7-payroll-cost
          npm run check:payroll
          npm run check:leave-compliance
          npm run check:attendance
          npm run check:attendance-daily
          npm run check:attendance-exceptions
          npm run check:attendance-close
          npm run check:attendance-operations
          npm run check:cost-workflow
          npm run check:cost-period-operations
          npm run check:cost-imports
          npm run check:cost-aux-imports
          npm run check:cost-budgets
          npm run typecheck
          npm run verify
          npm run build
          git diff --check
      - name: Build isolated PostgreSQL fixture
        run: |
          psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE auth.users(id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE FUNCTION auth.role() RETURNS text LANGUAGE sql STABLE AS $$ SELECT COALESCE(current_setting('request.jwt.claim.role',true),'') $$;
          CREATE FUNCTION public.has_permission(uuid,text,text) RETURNS boolean LANGUAGE sql STABLE AS $$ SELECT true $$;
          CREATE FUNCTION public.is_admin(uuid) RETURNS boolean LANGUAGE sql STABLE AS $$ SELECT true $$;
          CREATE TABLE public.hr_attendance_periods(id uuid PRIMARY KEY DEFAULT gen_random_uuid());
          CREATE TABLE public.hr_payroll_runs(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),run_no text NOT NULL,period_year int NOT NULL,period_month int NOT NULL,status text NOT NULL,attendance_period_id uuid REFERENCES public.hr_attendance_periods(id),attendance_snapshot_hash text,attendance_stale boolean NOT NULL DEFAULT false);
          CREATE TABLE public.hr_employees(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),employee_no text NOT NULL,full_name_ar text NOT NULL,department_id uuid);
          CREATE TABLE public.projects(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),name text);
          CREATE TABLE public.hr_payroll_lines(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),run_id uuid NOT NULL REFERENCES public.hr_payroll_runs(id),employee_id uuid NOT NULL REFERENCES public.hr_employees(id),project_id uuid REFERENCES public.projects(id),cost_entry_id uuid,gross_salary numeric DEFAULT 0,overtime numeric DEFAULT 0,unpaid_leave_deduction numeric DEFAULT 0,sick_leave_deduction numeric DEFAULT 0,absence_deduction numeric DEFAULT 0,late_deduction numeric DEFAULT 0,gosi_employer numeric DEFAULT 0,gosi_employee numeric DEFAULT 0,loan_deduction numeric DEFAULT 0);
          CREATE TABLE public.cost_entries(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),category text,description text,project text,project_id uuid,department_id uuid,period text,amount numeric,meta jsonb NOT NULL DEFAULT '{}'::jsonb,imported_by uuid,workflow_status text NOT NULL DEFAULT 'posted',source_type text NOT NULL DEFAULT 'legacy');
          ALTER TABLE public.hr_payroll_lines ADD CONSTRAINT hr_payroll_lines_cost_entry_fkey FOREIGN KEY(cost_entry_id) REFERENCES public.cost_entries(id);
          CREATE TABLE public.cost_periods(id uuid PRIMARY KEY DEFAULT gen_random_uuid(),period text NOT NULL UNIQUE,status text NOT NULL DEFAULT 'open',reason text,closed_by uuid,closed_at timestamptz,reopened_by uuid,reopened_at timestamptz,created_at timestamptz NOT NULL DEFAULT now());
          CREATE UNIQUE INDEX uq_cost_entries_hr_payroll_line_source ON public.cost_entries ((meta->>'payroll_line_id')) WHERE COALESCE(meta->>'source','')='hr_payroll' AND NULLIF(meta->>'payroll_line_id','') IS NOT NULL;
          CREATE FUNCTION public.hr_payroll_attendance_is_stale(uuid) RETURNS boolean LANGUAGE sql STABLE AS $$ SELECT attendance_stale FROM public.hr_payroll_runs WHERE id=$1 $$;
          CREATE FUNCTION public.hr_sync_payroll_cost_entries(uuid) RETURNS integer LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$ BEGIN RETURN 0; END $$;
          CREATE FUNCTION public.hr_sync_payroll_cost_entries_gate7_core(uuid) RETURNS integer LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$ BEGIN RETURN 0; END $$;
          CREATE FUNCTION public.cost_period_set_status(_period text,_closed boolean,_reason text) RETURNS public.cost_periods LANGUAGE plpgsql SECURITY DEFINER SET search_path='' AS $$ DECLARE v public.cost_periods; BEGIN INSERT INTO public.cost_periods(period,status,reason) VALUES(_period,CASE WHEN _closed THEN 'closed' ELSE 'open' END,_reason) ON CONFLICT(period) DO UPDATE SET status=EXCLUDED.status,reason=EXCLUDED.reason RETURNING * INTO v; RETURN v; END $$;
          SQL
      - name: Apply Gate 8 migration
        run: psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 -f supabase/migrations/20260903090000_gate8_payroll_cost_ledger.sql
      - name: Run PostgreSQL behavior assertions
        run: |
          psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.role','service_role',false);
          DO $$
          DECLARE
            v_emp uuid:=gen_random_uuid(); v_project uuid:=gen_random_uuid(); v_att uuid:=gen_random_uuid();
            v_run uuid:=gen_random_uuid(); v_line uuid:=gen_random_uuid(); v_count int; v_cost public.cost_entries;
            v_zero_run uuid:=gen_random_uuid(); v_neg_run uuid:=gen_random_uuid(); v_stale_run uuid:=gen_random_uuid(); v_paid_run uuid:=gen_random_uuid();
          BEGIN
            INSERT INTO public.hr_employees(id,employee_no,full_name_ar,department_id) VALUES(v_emp,'E-001','موظف اختبار',gen_random_uuid());
            INSERT INTO public.projects(id,name) VALUES(v_project,'مشروع اختبار');
            INSERT INTO public.hr_attendance_periods(id) VALUES(v_att);
            INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_period_id,attendance_snapshot_hash) VALUES(v_run,'PR-DRAFT',2026,8,'draft',v_att,'snap');
            INSERT INTO public.hr_payroll_lines(id,run_id,employee_id,project_id,gross_salary) VALUES(v_line,v_run,v_emp,v_project,1000);
            BEGIN PERFORM public.hr_sync_payroll_cost_entries(v_run); RAISE EXCEPTION 'draft payroll posted'; EXCEPTION WHEN OTHERS THEN IF SQLERRM='draft payroll posted' THEN RAISE; END IF; END;
            UPDATE public.hr_payroll_runs SET status='approved',run_no='PR-APPROVED' WHERE id=v_run;
            UPDATE public.hr_payroll_lines SET gross_salary=10000,overtime=500,unpaid_leave_deduction=200,sick_leave_deduction=100,absence_deduction=50,late_deduction=25,gosi_employer=1100,gosi_employee=900,loan_deduction=2000 WHERE id=v_line;
            v_count:=public.hr_sync_payroll_cost_entries(v_run); IF v_count<>1 THEN RAISE EXCEPTION 'approved first sync expected 1, got %',v_count; END IF;
            SELECT * INTO v_cost FROM public.cost_entries WHERE meta->>'payroll_line_id'=v_line::text;
            IF v_cost.amount<>11225 THEN RAISE EXCEPTION 'employer cost expected 11225, got %',v_cost.amount; END IF;
            IF v_cost.project_id IS DISTINCT FROM v_project OR v_cost.department_id IS DISTINCT FROM (SELECT department_id FROM public.hr_employees WHERE id=v_emp) THEN RAISE EXCEPTION 'dimension mapping mismatch'; END IF;
            IF v_cost.source_type<>'hr_payroll' OR v_cost.workflow_status<>'posted' OR v_cost.meta->>'payroll_run_id'<>v_run::text THEN RAISE EXCEPTION 'source/audit metadata mismatch'; END IF;
            v_count:=public.hr_sync_payroll_cost_entries(v_run); IF v_count<>0 OR (SELECT count(*) FROM public.cost_entries WHERE meta->>'payroll_line_id'=v_line::text)<>1 THEN RAISE EXCEPTION 'idempotent retry failed'; END IF;
            INSERT INTO public.cost_periods(period,status,reason) VALUES('2026-08','closed','اختبار إغلاق فترة التكاليف');
            BEGIN PERFORM public.hr_sync_payroll_cost_entries(v_run); RAISE EXCEPTION 'closed period accepted'; EXCEPTION WHEN OTHERS THEN IF SQLERRM='closed period accepted' THEN RAISE; END IF; END;
            DELETE FROM public.cost_periods WHERE period='2026-08';
            INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_period_id,attendance_snapshot_hash,attendance_stale) VALUES(v_stale_run,'PR-STALE',2026,9,'approved',v_att,'snap',true);
            INSERT INTO public.hr_payroll_lines(run_id,employee_id,gross_salary) VALUES(v_stale_run,v_emp,1000);
            BEGIN PERFORM public.hr_sync_payroll_cost_entries(v_stale_run); RAISE EXCEPTION 'stale payroll accepted'; EXCEPTION WHEN OTHERS THEN IF SQLERRM='stale payroll accepted' THEN RAISE; END IF; END;
            INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_period_id,attendance_snapshot_hash) VALUES(v_paid_run,'PR-PAID',2026,10,'paid',v_att,'snap');
            INSERT INTO public.hr_payroll_lines(run_id,employee_id,gross_salary,gosi_employer) VALUES(v_paid_run,v_emp,1000,100);
            IF public.hr_sync_payroll_cost_entries(v_paid_run)<>1 THEN RAISE EXCEPTION 'paid payroll did not post'; END IF;
            INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_period_id,attendance_snapshot_hash) VALUES(v_zero_run,'PR-ZERO',2026,11,'approved',v_att,'snap');
            INSERT INTO public.hr_payroll_lines(run_id,employee_id,gross_salary) VALUES(v_zero_run,v_emp,0);
            IF public.hr_sync_payroll_cost_entries(v_zero_run)<>0 THEN RAISE EXCEPTION 'zero cost row inserted'; END IF;
            INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_period_id,attendance_snapshot_hash) VALUES(v_neg_run,'PR-NEG',2026,12,'approved',v_att,'snap');
            INSERT INTO public.hr_payroll_lines(run_id,employee_id,gross_salary) VALUES(v_neg_run,v_emp,1000);
            INSERT INTO public.hr_payroll_lines(run_id,employee_id,gross_salary,absence_deduction) VALUES(v_neg_run,v_emp,100,200);
            BEGIN PERFORM public.hr_sync_payroll_cost_entries(v_neg_run); RAISE EXCEPTION 'negative cost accepted'; EXCEPTION WHEN OTHERS THEN IF SQLERRM='negative cost accepted' THEN RAISE; END IF; END;
            IF EXISTS(SELECT 1 FROM public.cost_entries WHERE meta->>'payroll_run_id'=v_neg_run::text) THEN RAISE EXCEPTION 'negative failure left partial posting'; END IF;
            PERFORM public.cost_period_set_status('2027-01',true,'سبب اختبار إغلاق الفترة');
            IF (SELECT status FROM public.cost_periods WHERE period='2027-01')<>'closed' THEN RAISE EXCEPTION 'period close failed'; END IF;
          END $$;
          SQL
      - name: Run concurrent same-run sync
        run: |
          psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 <<'SQL'
          SELECT set_config('request.jwt.claim.role','service_role',false);
          INSERT INTO public.hr_employees(id,employee_no,full_name_ar) VALUES('11111111-1111-1111-1111-111111111111','E-CON','موظف تزامن');
          INSERT INTO public.hr_payroll_runs(id,run_no,period_year,period_month,status,attendance_snapshot_hash) VALUES('22222222-2222-2222-2222-222222222222','PR-CON',2027,2,'approved','snap');
          INSERT INTO public.hr_payroll_lines(id,run_id,employee_id,gross_salary) VALUES('33333333-3333-3333-3333-333333333333','22222222-2222-2222-2222-222222222222','11111111-1111-1111-1111-111111111111',1000);
          SQL
          (psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 -Atc "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT public.hr_sync_payroll_cost_entries('22222222-2222-2222-2222-222222222222');" > /tmp/sync1.out) & p1=$!
          (psql -h 127.0.0.1 -U postgres -d gate8 -v ON_ERROR_STOP=1 -Atc "SELECT set_config('request.jwt.claim.role','service_role',false); SELECT public.hr_sync_payroll_cost_entries('22222222-2222-2222-2222-222222222222');" > /tmp/sync2.out) & p2=$!
          wait $p1
          wait $p2
          cat /tmp/sync1.out /tmp/sync2.out
          test "$(psql -h 127.0.0.1 -U postgres -d gate8 -Atc "SELECT count(*) FROM public.cost_entries WHERE meta->>'payroll_line_id'='33333333-3333-3333-3333-333333333333';")" = "1"
