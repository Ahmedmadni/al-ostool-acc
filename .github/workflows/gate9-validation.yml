name: Gate 9 validation

on:
  push:
    branches:
      - gate9-attendance-ui-refactor

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Verify attendance refactor invariants
        run: |
          test -f src/components/hr/attendance/attendance-workspace.tsx
          test -f src/components/hr/attendance/attendance-ui-helpers.tsx
          grep -q 'AttendanceWorkspace' src/routes/_authenticated/hr/attendance/index.tsx
          grep -q 'overflow-x-auto' src/components/hr/attendance/attendance-workspace.tsx
          grep -q 'hr_attendance_mobile_punch' src/routes/_authenticated/hr/attendance/index.tsx
          grep -q 'hr_attendance_close_period' src/routes/_authenticated/hr/attendance/index.tsx
          grep -q 'hr_attendance_reopen_period' src/routes/_authenticated/hr/attendance/index.tsx
          grep -q 'hr_attendance_scan_anomalies' src/routes/_authenticated/hr/attendance/index.tsx
          grep -q 'hr_attendance_register_device' src/routes/_authenticated/hr/attendance/index.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Full verification
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check HEAD~4..HEAD
