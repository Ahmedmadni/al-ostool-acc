name: Gate 19 Production Verification

on:
  push:
    branches:
      - gate19-production-verification

permissions:
  contents: read

concurrency:
  group: gate19-production-verification
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install deterministic compatibility set
        shell: bash
        run: |
          cp package.json /tmp/gate19-package.json
          npm pkg set 'dependencies.@tanstack/react-router=1.170.18'
          npm pkg set 'dependencies.@tanstack/react-start=1.168.34'
          npm pkg set 'dependencies.@tanstack/router-plugin=1.168.23'
          npm install --no-package-lock --ignore-scripts
          mv /tmp/gate19-package.json package.json

      - name: Audit production dependencies
        shell: bash
        run: |
          mkdir -p /tmp/gate19-audit
          cp package.json /tmp/gate19-audit/package.json
          cd /tmp/gate19-audit
          npm pkg set 'dependencies.@tanstack/react-router=1.170.18'
          npm pkg set 'dependencies.@tanstack/react-start=1.168.34'
          npm pkg set 'dependencies.@tanstack/router-plugin=1.168.23'
          npm install --package-lock-only --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Report full dependency audit
        if: always()
        shell: bash
        run: |
          cd /tmp/gate19-audit
          npm audit --audit-level=critical || true

      - name: Permanent production-readiness checker
        run: npm run check:gate19-production

      - name: Production build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Full regression verification
        run: npm run verify

      - name: Repository diff hygiene
        shell: bash
        run: |
          git diff --check
          test -z "$(git status --short)"
