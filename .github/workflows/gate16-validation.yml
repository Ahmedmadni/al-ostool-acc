name: Gate 16 validation

on:
  push:
    branches: [gate16-customer-service-hub]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Gate 16 static checks
        run: node scripts/check-gate16-customer-service-hub.mjs
      - name: Generate route tree and build
        run: npm run build
      - name: Commit generated route tree when needed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore: generate Gate 16 route tree"
            git push origin HEAD:gate16-customer-service-hub
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check origin/main...HEAD
