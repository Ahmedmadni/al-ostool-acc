name: Gate 17 validation

on:
  push:
    branches: [gate17-investment-holding-erp-apps]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate17
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          cp package.json /tmp/package-gate17.json
          npm pkg set 'dependencies.@tanstack/react-router=1.170.18'
          npm pkg set 'dependencies.@tanstack/react-start=1.168.34'
          npm pkg set 'dependencies.@tanstack/router-plugin=1.168.23'
          npm install --no-package-lock --ignore-scripts
          mv /tmp/package-gate17.json package.json
      - name: Gate 17 static checks
        run: |
          npm run check:gate17-investment-holding
          npm run check:permissions
      - name: PostgreSQL 16 Gate 17 migration and behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gate17 -f scripts/tmp-gate17-fixture.sql
          psql -h 127.0.0.1 -U postgres -d gate17 -f supabase/migrations/20260914130000_gate16_customer_service_hub.sql
          psql -h 127.0.0.1 -U postgres -d gate17 -f supabase/migrations/20260914131000_gate16_service_catalog.sql
          psql -h 127.0.0.1 -U postgres -d gate17 -f supabase/migrations/20260915190000_gate17_portfolio_it_foundation.sql
          psql -h 127.0.0.1 -U postgres -d gate17 -f scripts/tmp-gate17-behavior.sql
      - name: Gate 17 partial-application preflight
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          createdb -h 127.0.0.1 -U postgres gate17_partial
          psql -h 127.0.0.1 -U postgres -d gate17_partial -f scripts/tmp-gate17-fixture.sql
          psql -h 127.0.0.1 -U postgres -d gate17_partial -f supabase/migrations/20260914130000_gate16_customer_service_hub.sql
          psql -h 127.0.0.1 -U postgres -d gate17_partial -f supabase/migrations/20260914131000_gate16_service_catalog.sql
          psql -h 127.0.0.1 -U postgres -d gate17_partial -v ON_ERROR_STOP=1 -c "INSERT INTO public.group_companies(code,slug,name_ar,name_en,company_type,parent_company_id,sort_order) SELECT 'IT','technology','Partial IT','Partial IT','subsidiary',id,40 FROM public.group_companies WHERE code='HOLDING';"
          set +e
          psql -h 127.0.0.1 -U postgres -d gate17_partial -v ON_ERROR_STOP=1 -f supabase/migrations/20260915190000_gate17_portfolio_it_foundation.sql >/tmp/gate17-partial.log 2>&1
          code=$?
          set -e
          cat /tmp/gate17-partial.log
          if [ "$code" -eq 0 ]; then
            echo "Gate 17 preflight accepted a partial application state"
            exit 1
          fi
          grep -q "already or partially applied" /tmp/gate17-partial.log
      - name: Generate route tree and build
        run: npm run build
      - name: Commit generated route tree when needed
        shell: bash
        run: |
          if ! git diff --quiet -- src/routeTree.gen.ts; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routeTree.gen.ts
            git commit -m "chore: generate Gate 17 route tree"
            git push origin HEAD:gate17-investment-holding-erp-apps
          fi
      - name: Typecheck
        run: npm run typecheck
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check origin/main...HEAD
