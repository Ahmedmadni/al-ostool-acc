name: Gate 18 validation

on:
  push:
    branches: [gate18-zakat-hardening]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate18
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: PostgreSQL 16 Gate 18 migration and behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f scripts/tmp-gate18-fixture.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260825100000_flexible_zakat_sources.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260825110000_zakat_mapping_and_approval.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260825120000_zakat_templates_and_submission.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260825130000_zakat_history_and_reopen.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260825150000_tax_return_immutability.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f supabase/migrations/20260916120000_gate18_zakat_engine_hardening.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f scripts/tmp-gate18-behavior.sql
      - name: Gate 18 concurrent overlap guard
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set +e
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f scripts/tmp-gate18-concurrency-a.sql >/tmp/gate18-a.log 2>&1 &
          pid_a=$!
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18 -f scripts/tmp-gate18-concurrency-b.sql >/tmp/gate18-b.log 2>&1 &
          pid_b=$!
          wait "$pid_a"; code_a=$?
          wait "$pid_b"; code_b=$?
          set -e
          cat /tmp/gate18-a.log
          cat /tmp/gate18-b.log
          if [ "$code_a" -eq "$code_b" ]; then
            echo "Expected exactly one overlapping concurrent calculation to succeed"
            exit 1
          fi
          grep -q "تتداخل مع إقرار زكوي" /tmp/gate18-a.log || grep -q "تتداخل مع إقرار زكوي" /tmp/gate18-b.log
      - name: Gate 18 partial-application preflight
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          createdb -h 127.0.0.1 -U postgres gate18_partial
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f scripts/tmp-gate18-fixture.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260825100000_flexible_zakat_sources.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260825110000_zakat_mapping_and_approval.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260825120000_zakat_templates_and_submission.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260825130000_zakat_history_and_reopen.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260825150000_tax_return_immutability.sql
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -c "CREATE FUNCTION public.zakat_gate18_lock() RETURNS void LANGUAGE sql AS 'SELECT NULL::void';"
          set +e
          psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d gate18_partial -f supabase/migrations/20260916120000_gate18_zakat_engine_hardening.sql >/tmp/gate18-partial.log 2>&1
          code=$?
          set -e
          cat /tmp/gate18-partial.log
          if [ "$code" -eq 0 ]; then
            echo "Gate 18 preflight accepted a partial application state"
            exit 1
          fi
          grep -q "already or partially applied" /tmp/gate18-partial.log
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          cp package.json /tmp/package-gate18.json
          npm pkg set 'dependencies.@tanstack/react-router=1.170.18'
          npm pkg set 'dependencies.@tanstack/react-start=1.168.34'
          npm pkg set 'dependencies.@tanstack/router-plugin=1.168.23'
          npm install --no-package-lock --ignore-scripts
          mv /tmp/package-gate18.json package.json
      - name: Gate 18 static checks
        run: npm run check:gate18-zakat
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Full verification
        run: npm run verify
      - name: Diff check
        run: git diff --check origin/main...HEAD
