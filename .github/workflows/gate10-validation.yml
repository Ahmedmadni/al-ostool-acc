name: Gate 10 validation

on:
  push:
    branches:
      - gate10-hr-integration-rls-closure

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gate10
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Gate 10 static checks
        run: npm run check:gate10-hr-integration-rls
      - name: PostgreSQL 16 migration and behavior
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d gate10 -f scripts/tmp-gate10-fixture.sql
          psql -h 127.0.0.1 -U postgres -d gate10 -f supabase/migrations/20260906090000_gate10_hr_integration_rls_closure.sql
          psql -h 127.0.0.1 -U postgres -d gate10 -f scripts/tmp-gate10-behavior.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Full verification
        run: npm run verify
      - name: Build
        run: npm run build
      - name: Diff check
        run: git diff --check af0af82d4ad6d2a00538a4dfe07e8af99cadbd46..HEAD
